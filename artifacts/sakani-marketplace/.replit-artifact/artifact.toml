kind = "web"
previewPath = "/"
title = "Sakani Student Housing Marketplace"
description = "Arabic RTL student housing marketplace for searching listings, booking rooms, and managing student and owner workflows."
version = "1.0.0"
id = "artifacts/sakani-marketplace"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 3000

[services.development]
run = "npm --prefix ../.. run dev"

[services.production]

[services.production.build]
args = ["npm", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["npm", "run", "start"]

[services.production.run.env]
PORT = "3000"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"

[services.env]
PORT = "3000"
BASE_PATH = "/"